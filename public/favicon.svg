      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cc-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="cc-paper" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#312E81" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="cc-c1-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="cc-c2-flow" x1="0%" y1="30%" x2="100%" y2="100%">
